version: '3.8'

services:
  mani-dispatch:
    build:
      context: .
      dockerfile: Dockerfile
    image: mani-dispatch-dotnet:local
    container_name: mani-dispatch-dotnet
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
    env_file:
      - .env
